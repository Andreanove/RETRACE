$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: RETRACE
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: section-2
      title: Documentation
      path: documentation
      icon: book-blank
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation
    - type: section
      key: section-3
      title: Media
      path: media
      description: All Media in Game
      icon: images
      children:
        - type: space
          key: space-3
          title: Media
          path: media
          default: true
          content:
            directory: ./api-reference
    - type: section
      key: section-4
      title: Blog
      path: blog
      description: Developer blog about game
      icon: newspaper
      children:
        - type: space
          key: space-4
          title: Blog
          path: blog
          default: true
          content:
            directory: ./changelog
