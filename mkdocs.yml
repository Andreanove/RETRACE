
site_name: Retrace Documentation
site_description: Documentation and development journal for Retrace
site_url: https://USERNAME.github.io/Retrace-Docs/
repo_url: https://github.com/USERNAME/Retrace-Docs
repo_name: USERNAME/Retrace-Docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Characters:
      - Samuel: characters/samuel.md
      - Clara: characters/clara.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
